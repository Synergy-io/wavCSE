[project]
name = "wavcse"
version = "0.1.0"
description = "Modular speech representation learning framework: upstream SSL embedding extraction and downstream multi-task modeling"
requires-python = "==3.9.*"
dependencies = [
    # Core ML / audio stack
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "numpy==1.24.4",
    "scipy==1.9.3",
    "scikit-learn==1.2.0",
    # Visualization
    "matplotlib==3.7.1",
    # Experiment tracking / data versioning
    "mlflow==3.1.4",
    # Config / YAML
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
    # Jupyter
    # Data utilities
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "deptry>=0.23.1",
]
