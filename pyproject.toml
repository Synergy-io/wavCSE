[project]
name = "wavcse"
version = "0.1.0"
description = "Modular speech representation learning framework: upstream SSL embedding extraction and downstream multi-task modeling"
requires-python = "==3.9.*"
dependencies = [
    # Core ML / audio stack
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "numpy==1.24.4",
    "scipy==1.9.3",
    "scikit-learn==1.2.0",
    # Visualization
    "matplotlib==3.7.1",
    # Experiment tracking / data versioning
    "mlflow==3.1.4",
    # Config / YAML
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
    # mtlkit config system (Eng Review decision 1B, 2026-09-06)
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    # Jupyter
    # Data utilities
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only mtlkit is a real importable package. upstream/, downstream/, and
# improvements/ stay path-based (invoked via `cd <dir> && python main.py` /
# `python -m improvements.run_improvements`) and are never installed.
packages = ["mtlkit"]

[tool.uv]
# Installed editable so `import mtlkit` resolves regardless of invocation
# cwd (Eng Review cross-model tension, 2026-09-06 — cwd-based sys.path made
# the repo-root mtlkit/ sibling unreachable from `cd downstream && python
# main.py`). See docs/designs/speech-mtl-framework.md Constraints.
package = true

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "pdoc>=15.0.4",
]
