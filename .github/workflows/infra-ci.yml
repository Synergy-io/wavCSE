name: Infra CI

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825d76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cloud-init shellcheck shfmt

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run non-live validation
        run: make check
