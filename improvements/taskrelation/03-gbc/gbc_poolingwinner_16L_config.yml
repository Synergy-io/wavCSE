# wavCSE-GBC at the winning pooling from the 16-layer grid search:
# smp (softmax pooling), lambda=0.5 -- see improvements/base/POOLING_GRID_SEARCH.md
# for the full grid. GBC has never been trained in this project before this
# config was created (see README.md) -- this is a first screening run, not
# a confirmed-good config yet.
#
# Copy of ../01-mtrl/mtrl_poolingwinner_16L_config.yml with the MTRL-specific
# model fields (mtrl_lambda/omega_epsilon/normalize_w) and the `mtrl:` block
# replaced by GBC's own (gbc_global_dim), and experiment_name changed to
# taskrelation-gbc. Everything else (pooling, layer selection, training/eval
# hyperparameters) is identical, for a fair comparison against baseline/MTRL
# at the same settings.

log_level: INFO
seed: 42  # improvements/seed_utils.py -- override here or with --seed for multi-seed runs

device:
  type: cuda
  index: 0

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/embedding
  results_root: results_gbc_poolingwinner_16L
  checkpoints_root: checkpoints_gbc_poolingwinner_16L

upstream:
  model_type: wavlm_large
  selected_transformer_layers: 6,1,0,3,2,5,4,7,8,9,10,11,12,17,14,13

dataset:
  subset_percentage: 100
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null
  layer_pooling_type: smp
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6
  # GBC-specific
  gbc_global_dim: 64

training:
  num_epochs: 30
  batch_size: 2048
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 1
  shuffle_train: true
  shuffle_val: false
  pin_memory: true
  drop_last_train: true
  drop_last_val: false
  num_workers: 4
  patience: 5
  factor: 0.5
  l1_lambda: 0.0000001
  l2_lambda: 0.00001

evaluation:
  batch_size: 2048
  shuffle: false
  pin_memory: true
  drop_last: false
  num_workers: 4

# ----------------------------
# MLflow / DagsHub tracking
# ----------------------------
mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: taskrelation-gbc
