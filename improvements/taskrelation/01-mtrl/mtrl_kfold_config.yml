# =============================================================================
# MTRL ER 10-fold (leave-one-speaker-out) cross-validation config.
#
# Copy of mtrl_poolingwinner_25L_config.yml (the current best MTRL config:
# smp pooling lambda=0.5, all 25 layers, mtrl_lambda=0.01, normalize_w=true)
# with the same compute-budget tradeoff improvements/base/base_kfold_config.yml
# uses for the baseline LOSO sweep: num_epochs reduced to 5, separate
# results/checkpoints roots, separate mlflow experiment name.
#
# mtrl.warmup_epochs is reduced from 3 (out of 30, in the single-split config)
# to 1 (out of 5 here) to keep roughly the same warmup *fraction* of training
# -- otherwise 3/5 epochs would be spent with the MTRL regularizer disabled,
# far more than the single-split run's 10%.
#
# See improvements/base/README.md's "ER 10-fold cross-validation" section for
# the baseline LOSO results this is meant to be compared against.
# =============================================================================

log_level: INFO
seed: 42  # improvements/seed_utils.py -- override here or with --seed for multi-seed runs

device:
  type: cuda
  index: 0

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/embedding
  results_root: results_mtrl_kfold
  checkpoints_root: checkpoints_mtrl_kfold

upstream:
  model_type: wavlm_large
  selected_transformer_layers: all

dataset:
  subset_percentage: 100
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null

  layer_pooling_type: smp
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6
  # MTRL-specific (established best from the 16/25-layer pooling-winner campaigns)
  mtrl_lambda: 0.01
  omega_epsilon: 0.0001
  normalize_w: true

training:
  num_epochs: 5
  batch_size: 2048
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 1

  shuffle_train: true
  shuffle_val: true
  pin_memory: true
  drop_last_train: true
  drop_last_val: false
  num_workers: 4

  patience: 1
  factor: 0.5

  l1_lambda: 0.0000001
  l2_lambda: 0.00001

# MTRL-specific
mtrl:
  warmup_epochs: 1
  omega_update_frequency: 1

evaluation:
  batch_size: 2048
  shuffle: false
  pin_memory: true
  drop_last: false
  num_workers: 4

# ----------------------------
# MLflow / DagsHub tracking
# ----------------------------
mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: taskrelation-mtrl-er-kfold
