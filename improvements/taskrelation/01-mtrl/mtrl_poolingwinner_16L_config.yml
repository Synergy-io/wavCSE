# wavCSE-MTRL at the winning pooling from the 16-layer grid search:
# smp (softmax pooling), lambda=0.5 -- beat the mix-pooling baseline
# (0.9724 vs 0.9710 test_opt_acc_all) and every other pooling type tried.
# See improvements/base/POOLING_GRID_SEARCH.md for the full grid.
#
# Copy of mtrl_config.yml with only pooling.layer_pooling_type/param changed
# (weighted -> smp, param=0.5) -- MTRL hyperparameters are the already-
# established best (mtrl_lambda=0.01, normalize_w=true).

log_level: INFO

device:
  type: cuda
  index: 0

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/embedding
  results_root: results_mtrl_poolingwinner_16L
  checkpoints_root: checkpoints_mtrl_poolingwinner_16L

upstream:
  model_type: wavlm_large
  selected_transformer_layers: 6,1,0,3,2,5,4,7,8,9,10,11,12,17,14,13

dataset:
  subset_percentage: 100
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null
  layer_pooling_type: smp
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6
  # MTRL-specific (established best from the 16-layer campaign)
  mtrl_lambda: 0.01
  omega_epsilon: 0.0001
  normalize_w: true

training:
  num_epochs: 30
  batch_size: 2048
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 1
  shuffle_train: true
  shuffle_val: false
  pin_memory: true
  drop_last_train: true
  drop_last_val: false
  num_workers: 4
  patience: 5
  factor: 0.5
  l1_lambda: 0.0000001
  l2_lambda: 0.00001

# MTRL-specific
mtrl:
  warmup_epochs: 3
  omega_update_frequency: 1

evaluation:
  batch_size: 2048
  shuffle: false
  pin_memory: true
  drop_last: false
  num_workers: 4

# ----------------------------
# MLflow / DagsHub tracking
# ----------------------------
mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: taskrelation-mtrl
