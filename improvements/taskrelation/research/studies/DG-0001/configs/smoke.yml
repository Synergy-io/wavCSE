# DG-0001 prerequisite only. Metrics are never included in the transfer matrix.

log_level: INFO
seed: 42

device:
  type: cuda
  index: 0

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/embedding
  results_root: improvements/taskrelation/research/studies/DG-0001/outputs/smoke/results
  checkpoints_root: improvements/taskrelation/research/studies/DG-0001/outputs/smoke/checkpoints

upstream:
  model_type: wavlm_large
  selected_transformer_layers: all

dataset:
  subset_percentage: 3
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null
  layer_pooling_type: smp
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6

training:
  num_epochs: 1
  batch_size: 256
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 1
  shuffle_train: true
  shuffle_val: false
  pin_memory: true
  drop_last_train: false
  drop_last_val: false
  num_workers: 4
  patience: 1
  factor: 0.5
  l1_lambda: 0.0000001
  l2_lambda: 0.00001

evaluation:
  batch_size: 512
  shuffle: false
  pin_memory: true
  drop_last: false
  num_workers: 4

mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: taskrelation-diagnostics

research:
  study_id: DG-0001
  stage: smoke
  method: wavcse_baseline
  run_note: "DG-0001 prerequisite smoke test; excluded from scientific results."
