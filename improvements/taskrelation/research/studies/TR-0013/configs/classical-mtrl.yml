# TR-0013 screen arm 3: classical symmetric MTRL (the in-category control).
#
# Unchanged from the TR-0007 control copy
# (`studies/TR-0007/configs/classical-mtrl.yml`, itself unchanged from
# `01-mtrl/mtrl_poolingwinner_25L_config.yml` apart from its own header,
# study-local roots and `research:` block) except for this header, the
# TR-0013 study-local results/checkpoints roots, and the appended `research:`
# block: the protocol holds every shared condition constant across arms, and
# the arm is identified (not re-tuned) by the study tags. TR-0013 adds no
# MTRL hyperparameter and changes nothing here.
#
# DEC-0017: historical MTRL remains the protocol's section 2 in-category
# control, so this arm is the same one TR-0007 ran.

log_level: INFO
seed: 42  # improvements/seed_utils.py -- override here or with --seed for multi-seed runs

device:
  type: cuda
  index: 0

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/embedding
  results_root: improvements/taskrelation/research/studies/TR-0013/outputs/classical-mtrl/results
  checkpoints_root: improvements/taskrelation/research/studies/TR-0013/outputs/classical-mtrl/checkpoints

upstream:
  model_type: wavlm_large
  selected_transformer_layers: all

dataset:
  subset_percentage: 100
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null
  layer_pooling_type: smp
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6
  # MTRL-specific (established best from the 16-layer campaign)
  mtrl_lambda: 0.01
  omega_epsilon: 0.0001
  normalize_w: true

training:
  num_epochs: 30
  batch_size: 2048
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 1
  shuffle_train: true
  shuffle_val: false
  pin_memory: true
  drop_last_train: true
  drop_last_val: false
  num_workers: 4
  patience: 5
  factor: 0.5
  l1_lambda: 0.0000001
  l2_lambda: 0.00001

# MTRL-specific
mtrl:
  warmup_epochs: 3
  omega_update_frequency: 1

evaluation:
  batch_size: 2048
  shuffle: false
  pin_memory: true
  drop_last: false
  num_workers: 4

# ----------------------------
# MLflow / DagsHub tracking
# ----------------------------
mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: taskrelation-mtrl

# TR-0013 arm provenance: the run carries the study's identity tags and the
# DagsHub run note, so the study is reconstructible across the experiments the
# arm's own architecture owns (see improvements/README.md's naming convention).
research:
  study_id: TR-0013
  stage: screen
  family: task_relation_learning
  method: classical-mtrl
  hypothesis_slug: published-lambda2-axis
  task_set: ks_si_er
  representation: smp25
  parent_study: TR-0007
  protocol: variant-benchmark-protocol
  lambda_2: not-applicable
  lambda_2_selection: not-applicable-no-relation-penalty
  agent_generated: true
  status: pre_registered
  run_note_file: improvements/taskrelation/research/studies/TR-0013/NOTE.md
