# Baseline with ALL 25 WavLM-Large layers (vs. the hand-picked 16-layer
# subset in base_config.yml).
#
# Copy of base_config.yml with exactly two changes:
#   1. upstream.selected_transformer_layers: <16-layer list> -> "all" (the
#      parser special-cases this string to list(range(25)) for wavlm_large
#      -- confirmed the shared embedding cache already stores all 25 layers
#      per utterance, so no re-extraction is needed).
#   2. results/checkpoints roots renamed (*_alllayers) so these runs don't
#      mix with the 16-layer canonical baseline runs.
# Everything else (epochs, lr, schedule, eval settings, mix pooling) is
# identical to the canonical baseline, so this isolates the layer-count
# question alone.

log_level: INFO
seed: 42  # improvements/seed_utils.py -- override here or with --seed for multi-seed runs

device:
  type: cuda
  index: 1

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/dataset/embedding
  results_root: results_base_alllayers
  checkpoints_root: checkpoints_base_alllayers

upstream:
  model_type: wavlm_large
  selected_transformer_layers: all

dataset:
  subset_percentage: 100
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null

  layer_pooling_type: mix
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6

training:
  num_epochs: 30
  batch_size: 2048
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 1

  shuffle_train: true
  shuffle_val: true
  pin_memory: true
  drop_last_train: true
  drop_last_val: false
  num_workers: 4

  patience: 1
  factor: 0.5

  l1_lambda: 0.0000001
  l2_lambda: 0.00001

evaluation:
  batch_size: 1
  shuffle: false
  pin_memory: true
  drop_last: false
  num_workers: 4

# ----------------------------
# MLflow / DagsHub tracking
# ----------------------------
mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: wavcse-baseline
