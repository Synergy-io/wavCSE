# =============================================================================
# ER 10-fold (leave-one-speaker-out) cross-validation config.
#
# Copy of base_config.yml, with: separate results/checkpoints roots (so folds
# don't collide with single-split base runs), num_epochs reduced to 5 (10x
# fold count vs. the single-split baseline -- see improvements/base/README.md
# for the compute-budget tradeoff), and a separate mlflow experiment name.
# All other hyperparameters (patience, factor, learning_rate, ...) are left
# unchanged from base_config.yml -- not in scope for this experiment.
#
# Pooling updated 2026-09-01: smp / lambda=0.5 / all 25 layers, matching the
# pooling-grid-search winner and the project's current best baseline
# (improvements/base/POOLING_GRID_SEARCH.md -- 0.9767 test_opt_acc_all,
# 0.7902 test_opt_er_acc). The first LOSO sweep (2026-08-17) ran on the
# stale `mix`, lambda=0.5, 16-layer config that predates the grid search --
# treat improvements/base/results_base_kfold/kfold_summary.json from that
# date as superseded, not a citable number for the current best config.
# =============================================================================

log_level: INFO
seed: 42  # improvements/seed_utils.py -- override here or with --seed for multi-seed runs

device:
  type: cuda
  index: 1

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/dataset/embedding
  results_root: results_base_kfold
  checkpoints_root: checkpoints_base_kfold

upstream:
  model_type: wavlm_large
  selected_transformer_layers: all

dataset:
  subset_percentage: 100
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null

  layer_pooling_type: smp
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6

training:
  num_epochs: 5
  batch_size: 2048
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 1

  shuffle_train: true
  shuffle_val: true
  pin_memory: true
  drop_last_train: true
  drop_last_val: false
  num_workers: 4

  patience: 1
  factor: 0.5

  l1_lambda: 0.0000001
  l2_lambda: 0.00001

evaluation:
  batch_size: 1
  shuffle: false
  pin_memory: true
  drop_last: false
  num_workers: 4

# ----------------------------
# MLflow / DagsHub tracking
# ----------------------------
mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: wavcse-baseline-er-kfold
