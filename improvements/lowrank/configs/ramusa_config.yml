# RAMUSA-inspired neural reduced-rank training for KS, speaker ID, and ER.
log_level: INFO

device:
  type: cuda
  index: 0

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/dataset/embedding
  results_root: results_ramusa
  checkpoints_root: checkpoints_ramusa

upstream:
  model_type: wavlm_large
  selected_transformer_layers: all

dataset:
  subset_percentage: 10
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null
  layer_pooling_type: mix
  layer_pooling_param: 0.5

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  adapter_dim: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6

ramusa:
  enabled: true
  lambda: 0.1
  tau: 1.0
  num_stages: 5
  epochs_per_stage: 5

training:
  num_epochs: 25
  batch_size: 2048
  learning_rate: 0.0025
  label_smoothing: 0.1
  weight_decay: 0.00000005
  shuffle_train: true
  shuffle_val: false
  pin_memory: false
  drop_last_train: true
  drop_last_val: false
  num_workers: 0
  scheduler_patience: 3
  scheduler_factor: 0.5
  l1_lambda: 0.0000001
  l2_lambda: 0.00001

evaluation:
  batch_size: 2048
  shuffle: false
  pin_memory: false
  drop_last: false
  num_workers: 0

tensorboard:
  enabled: false
  gradient_log_interval: 100
  histogram_epoch_interval: 5

mlflow:
  tracking_uri: https://dagshub.com/Ke-vin-S/wavCSE.mlflow
  experiment_name: wavcse-ramusa
